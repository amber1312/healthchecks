name: Snyk
on: workflow_dispatch

jobs:
  snyk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          grep -m1 "model name" /proc/cpuinfo
          nproc
          free -m | head -2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies (setup, not timed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Snyk CLI (pinned)
        run: |
          npm install -g snyk@1.1308.4
          snyk --version

      - name: Snyk scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --json-file-output=snyk-result.json

      - name: Verify scan output
        run: |
          test -s snyk-result.json
          jq -r '[.[]? // .] | map(.packageManager) | join(",")' snyk-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: snyk-result
          path: snyk-result.json
