name: ZAP
on: workflow_dispatch

jobs:
  zap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          grep -m1 "model name" /proc/cpuinfo
          nproc
          free -m | head -2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies (setup, not timed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app
        env:
          SECRET_KEY: ci-dummy-key
        run: |
          python manage.py migrate
          nohup python manage.py runserver 0.0.0.0:8000 > app.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            echo "http=$CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then exit 0; fi
            sleep 3
          done
          echo "app did not start"; tail -n 50 app.log; exit 1

      - name: ZAP baseline scan
        run: |
          mkdir zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8000 -J zap-report.json -I

      - name: Verify scan output
        run: test -s zap-out/zap-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: zap-result
          path: zap-out/zap-report.json
